name: petracore_flutter_frontend_starter
description: A powerful CLI tool and package for generating Flutter projects with clean architecture, Firebase integration, and best practices.
version: 1.1.1
homepage: https://github.com/PetraCoreTech/petracore_flutter_frontend_starter
repository: https://github.com/PetraCoreTech/petracore_flutter_frontend_starter
issue_tracker: https://github.com/PetraCoreTech/petracore_flutter_frontend_starter/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  io: ^1.0.5
  yaml: ^3.1.3
  mustache_template: ^2.0.0
  recase: ^4.1.0
  cli_util: ^0.5.1

dev_dependencies:
  test: ^1.31.0
  lints: ^6.1.0

executables:
  petracore: main

scripts:
  build: dart compile exe bin/main.dart -o petracore
